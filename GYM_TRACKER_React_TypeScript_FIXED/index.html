<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#090c13" />
    <meta name="description" content="GYM TRACKER — журнал тренировок, прогрессивная перегрузка и аналитика без регистрации." />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>GYM TRACKER — Тренируйся с прогрессом</title>
    <script>
      try {
        const saved = JSON.parse(localStorage.getItem('gym-tracker:v1') || '{}');
        document.documentElement.classList.toggle('dark', saved.theme !== 'light');
      } catch { document.documentElement.classList.add('dark'); }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
